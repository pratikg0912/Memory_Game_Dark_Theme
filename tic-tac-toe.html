<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe3f0;
      --x-color: #ef4444;
      --o-color: #10b981;
      --shadow: rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef4ff, var(--bg));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .game-wrap {
      width: min(90vw, 420px);
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 24px 20px 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }

    .status {
      text-align: center;
      font-weight: 700;
      margin: 0 0 18px;
      min-height: 28px;
      color: var(--text);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .score-box {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      background: white;
      border: 1px solid var(--line);
    }

    .score-box strong {
      display: block;
      font-size: 1.4rem;
    }

    .score-box span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      background: #f8fafc;
      border-radius: 14px;
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
    }

    .cell:hover:not(:disabled) {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      color: var(--x-color);
    }

    .cell.o {
      color: var(--o-color);
    }

    .controls {
      display: flex;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>Tic-Tac-Toe</h1>

    <div class="status" id="status">Player X's turn</div>

    <div class="scoreboard">
      <div class="score-box">
        <strong id="x-score">0</strong>
        <span>X Wins</span>
      </div>
      <div class="score-box">
        <strong id="draw-score">0</strong>
        <span>Draws</span>
      </div>
      <div class="score-box">
        <strong id="o-score">0</strong>
        <span>O Wins</span>
      </div>
    </div>

    <div class="board" id="board" aria-label="Tic Tac Toe Board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="controls">
      <button id="reset-btn" type="button">Reset Board</button>
    </div>
  </div>

  <script>
    const board = Array(9).fill('');
    const humanPlayer = 'X';
    const computerPlayer = 'O';
    let gameActive = true;

    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const xScoreEl = document.getElementById('x-score');
    const oScoreEl = document.getElementById('o-score');
    const drawScoreEl = document.getElementById('draw-score');

    let xWins = 0;
    let oWins = 0;
    let draws = 0;

    const winningPatterns = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function updateScoreboard() {
      xScoreEl.textContent = xWins;
      oScoreEl.textContent = oWins;
      drawScoreEl.textContent = draws;
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function checkWinnerState(state) {
      for (const pattern of winningPatterns) {
        const [a, b, c] = pattern;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) {
          return state[a];
        }
      }
      return null;
    }

    function checkWinner() {
      return checkWinnerState(board);
    }

    function endGame(winner) {
      gameActive = false;
      if (winner === humanPlayer) {
        xWins += 1;
        setStatus('You win!');
      } else if (winner === computerPlayer) {
        oWins += 1;
        setStatus('Computer wins!');
      } else {
        draws += 1;
        setStatus('It is a draw!');
      }
      updateScoreboard();
      cells.forEach((cell) => {
        cell.disabled = true;
      });
    }

    function getAvailableMoves(state = board) {
      return state
        .map((value, index) => (value === '' ? index : null))
        .filter((value) => value !== null);
    }

    function minimax(state, depth, isMaximizing) {
      const winner = checkWinnerState(state);

      if (winner === computerPlayer) {
        return 10 - depth;
      }

      if (winner === humanPlayer) {
        return depth - 10;
      }

      if (state.every((value) => value !== '')) {
        return 0;
      }

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (const move of getAvailableMoves(state)) {
          state[move] = computerPlayer;
          const score = minimax(state, depth + 1, false);
          state[move] = '';
          bestScore = Math.max(bestScore, score);
        }
        return bestScore;
      }

      let bestScore = Infinity;
      for (const move of getAvailableMoves(state)) {
        state[move] = humanPlayer;
        const score = minimax(state, depth + 1, true);
        state[move] = '';
        bestScore = Math.min(bestScore, score);
      }
      return bestScore;
    }

    function findBestMove() {
      let bestScore = -Infinity;
      let bestMove = null;

      for (const move of getAvailableMoves()) {
        board[move] = computerPlayer;
        const score = minimax(board, 0, false);
        board[move] = '';

        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }

      return bestMove;
    }

    function makeComputerMove() {
      if (!gameActive) {
        return;
      }

      const bestMove = findBestMove();
      if (bestMove === null) {
        return;
      }

      board[bestMove] = computerPlayer;
      const cell = cells[bestMove];
      cell.textContent = computerPlayer;
      cell.classList.add('o');
      cell.disabled = true;

      const winner = checkWinner();
      if (winner) {
        endGame(winner);
        return;
      }

      const isDraw = board.every((value) => value !== '');
      if (isDraw) {
        endGame(null);
        return;
      }

      setStatus('Your turn');
    }

    function handleCellClick(event) {
      const cell = event.target;
      const index = Number(cell.dataset.index);

      if (board[index] || !gameActive) {
        return;
      }

      board[index] = humanPlayer;
      cell.textContent = humanPlayer;
      cell.classList.add('x');
      cell.disabled = true;

      const winner = checkWinner();
      if (winner) {
        endGame(winner);
        return;
      }

      const isDraw = board.every((value) => value !== '');
      if (isDraw) {
        endGame(null);
        return;
      }

      setStatus('Computer is thinking...');
      cells.forEach((item) => {
        item.disabled = true;
      });

      setTimeout(() => {
        cells.forEach((item) => {
          if (!board[Number(item.dataset.index)]) {
            item.disabled = false;
          }
        });
        makeComputerMove();
      }, 450);
    }

    function resetBoard() {
      board.fill('');
      gameActive = true;

      cells.forEach((cell) => {
        cell.textContent = '';
        cell.classList.remove('x', 'o');
        cell.disabled = false;
      });

      setStatus("Your turn");
    }

    cells.forEach((cell) => {
      cell.addEventListener('click', handleCellClick);
    });

    resetBtn.addEventListener('click', resetBoard);
    updateScoreboard();
    setStatus("Your turn");
  </script>
</body>
</html>
